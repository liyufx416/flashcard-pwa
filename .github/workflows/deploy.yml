name: Deploy to S3 and invalidate CloudFront Distribution, with Auto-Versioning to 'deploy' branch

on:
  push:
    branches:
      - main  # Prod deployment from main branch only
      - staging  # Staging deployment from staging branch only
      
# Permissions required for OIDC (id-token) and for writing to the repo (contents).
# 'contents: write' is crucial for the Git push operations.
permissions:
  id-token: write
  contents: write

jobs:
  version-and-deploy:
    runs-on: ubuntu-latest

    # Define the environment based on the branch.
    # GitHub will automatically load secrets/variables from this environment.
    environment:
      ${{ github.ref_name == 'main' && 'Prod' || github.ref_name == 'staging' && 'staging' }}
      # This conditional chooses the environment:
      # - If branch is 'main', target 'Prod' environment.
      # - If branch is 'staging', target 'Staging' environment.
    env:
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.AWS_CF_DISTRIBUTION_ID}}
      DEPLOY_BRANCH: deploy # The branch used for versioning and deployment
      DEPLOY_DESTINATION_BRANCH: ${{ github.ref_name == 'main' && 'deploy' || github.ref_name == 'staging' && 'deploy-staging' }}
      TRIGGERING_BRANCH: ${{ github.ref_name }}  # branch triggering the deployment

    steps:
      - name: Checkout or Create Deploy Branch
        uses: actions/checkout@v3
        with:
          # Attempt to checkout the deploy branch. If it doesn't exist remotely,
          # actions/checkout will default to checking out the triggering branch (main).
          # We need to fetch all history for merging and branch creation.
          ref: ${{ env.DEPLOY_BRANCH }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git for the bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Handle Deploy Branch Existence and Merge from triggering branch
        run: |
          # Check if the deploy branch exists remotely
          DEPLOY_BRANCH_EXISTS=$(git ls-remote --heads origin ${{ env.DEPLOY_BRANCH }} | wc -l)

          if [ "$DEPLOY_BRANCH_EXISTS" -eq 0 ]; then
            echo "Deploy branch does not exist on remote. Creating it from '${{ env.TRIGGERING_BRANCH }}' and pushing."
            # If actions/checkout couldn't find deploy, it checked out main.
            # So, create new deploy branch from current HEAD (which is main's latest state).
            git checkout -b ${{ env.DEPLOY_BRANCH }}
            git push -u origin ${{ env.DEPLOY_BRANCH }}
            echo "Successfully created and pushed new deploy branch."
            NO_MERGE_NEEDED="true" # Flag to skip merging main into deploy for the very first creation
          else
            echo "Deploy branch exists. Switching to it and preparing to merge '${{ env.TRIGGERING_BRANCH }}'."
            git checkout ${{ env.DEPLOY_BRANCH }}
            git pull origin ${{ env.DEPLOY_BRANCH }} # Ensure local deploy is up-to-date with remote deploy
            NO_MERGE_NEEDED="false"
          fi

          # Only attempt merge if deploy branch already existed
          if [ "$NO_MERGE_NEEDED" != "true" ]; then
            echo "Merging latest changes from '${{ env.TRIGGERING_BRANCH }}' into '${{ env.DEPLOY_BRANCH }}'."
            git fetch origin ${{ env.TRIGGERING_BRANCH }}:${{ env.TRIGGERING_BRANCH }} # Fetch main to merge from it
            
            # Attempt merge. If conflicts occur, resolve by preferring 'main's version.
            # We use --no-commit to handle conflicts in script before committing.
            if git merge --no-ff --no-commit ${{ env.TRIGGERING_BRANCH }}; then
                echo "Merge completed without conflicts."
                git commit -m "Merge branch '${{ env.TRIGGERING_BRANCH }}' into ${{ env.DEPLOY_BRANCH }}"
            else
                echo "Merge resulted in conflicts. Resolving by preferring '${{ env.TRIGGERING_BRANCH }}' for all conflicted files."
                # Get list of conflicted files
                CONFLICTED_FILES=$(git diff --name-only --diff-filter=U)
                if [ -z "$CONFLICTED_FILES" ]; then
                  echo "No conflicted files found, something is wrong with merge status. Committing existing changes."
                  git commit -m "Merge branch '${{ env.TRIGGERING_BRANCH }}' into ${{ env.DEPLOY_BRANCH }}"
                else
                  # For each conflicted file, checkout the version from the main branch (theirs in merge context)
                  for file in $CONFLICTED_FILES; do
                    echo "Resolving conflict in $file: Preferring '${{ env.TRIGGERING_BRANCH }}' version."
                    git checkout --theirs "$file" # 'theirs' refers to the branch being merged FROM (main)
                    git add "$file"
                  done
                  # Commit the conflict resolution
                  git commit -m "Merge branch '${{ env.TRIGGERING_BRANCH }}' into ${{ env.DEPLOY_BRANCH }} (auto-resolved conflicts preferring main)"
                fi
            fi
          fi
          echo "Pushing into: ${{ env.DEPLOY_DESTINATION_BRANCH }}"
          git push -u origin ${{ env.DEPLOY_BRANCH }}:${{ env.DEPLOY_DESTINATION_BRANCH }} --force # Force push the merge commit

      - name: Get current date and format for credits.md
        id: date
        run: echo "RELEASE_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Read current version, increment micro, and update credits.md
        run: |
          MANIFEST_PATH="./manifest.json"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "Error: manifest.json not found at $MANIFEST_PATH"
            exit 1
          fi

          # Read the version from the manifest.json (which is now from the 'deploy' branch after merge)
          CURRENT_VERSION_FULL=$(jq -r '.version' "$MANIFEST_PATH")
          
          # Parse version parts. EXISTING_MICRO will be empty if version is "X.Y"
          IFS='.' read -r -a VERSION_PARTS <<< "$CURRENT_VERSION_FULL"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          EXISTING_MICRO=${VERSION_PARTS[2]}

          NEW_MICRO=0 # Default new micro version

          # Logic to determine new micro version:
          # If no micro version exists (e.g., from a main branch change), start at 0.
          # Otherwise, increment the existing micro version.
          if [ -z "$EXISTING_MICRO" ]; then
            echo "Manifest.json version is '$CURRENT_VERSION_FULL' (without micro). Starting micro at 0."
            NEW_MICRO=0
          else
            echo "Manifest.json version is '$CURRENT_VERSION_FULL' (with existing micro). Incrementing micro."
            NEW_MICRO=$((EXISTING_MICRO + 1))
          fi

          if [ "$github.ref_name" == 'main' ]; then
            NEW_VERSION="$MAJOR.$MINOR.$NEW_MICRO" 
          else
            NEW_VERSION="$MAJOR.$MINOR.$NEW_MICRO Beta"
          fi

          echo "Old Version: $CURRENT_VERSION_FULL"
          echo "New Version: $NEW_VERSION"

          # Update manifest.json with the new version
          jq ".version = \"$NEW_VERSION\"" "$MANIFEST_PATH" > temp_manifest.json && mv temp_manifest.json "$MANIFEST_PATH"
          echo "Updated $MANIFEST_PATH to version $NEW_VERSION"

          CREDIT_PATH="./credits.md"
          if [ ! -f "$CREDIT_PATH" ]; then
            echo "Error: credits.md not found at $CREDIT_PATH"
            exit 1
          fi
          # Update credits.md with the new release date
          sed -i "s/^Last Release Date: .*/Last Release Date: ${{ env.RELEASE_DATE }}/" "$CREDIT_PATH"
          echo "Updated $CREDIT_PATH with date ${{ env.RELEASE_DATE }}"

          # Set environment variable for the new version for potential use in commit message
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

          # Change to Beta icon for staging deployment
          if [ "$github.ref_name" != "main" ]; then
            echo "Updating beta icons"
            cp images/flashcard-beta-512.png images/flashcard-512.png
            cp images/apple-touch-icon-beta.png images/apple-touch-icon.png
            cp images/favicon-beta.ico images/favicon.ico
          fi
          
      - name: Commit version and date changes to deploy branch
        run: |
          git add manifest.json credits.md
          # Change to Beta icon for staging deployment
          if [ "$github.ref_name" != "main" ]; then
            git add images/flashcard-512.png images/apple-touch-icon.png images/favicon.ico
          fi
          # Only commit if there are actual changes (e.g., if version was bumped or date changed)
          git commit -m "chore(deploy): Bump version to ${{ env.NEW_VERSION }} on ${{ env.RELEASE_DATE }}" || echo "No version bump changes to commit"
          git push -u origin ${{ env.DEPLOY_BRANCH }}:${{ env.DEPLOY_DESTINATION_BRANCH }} --force # Force push the merge commit
          echo "Environment ${{ vars.ENV_NAME }} ${{ vars.AWS_ROLE_ARN }} ${{ vars.AWS_REGION }}"

      - name: Configure AWS Credentials (using OIDC)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }} # 
          aws-region: ${{ vars.AWS_REGION }}       

      - name: Sync files to S3
        run: |
          aws s3 sync . s3://${{ env.AWS_S3_BUCKET }}/ \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "node_modules/*" \
            --exclude "package*.json" \
            --exclude "README.md"
          echo "Successfully synced files to S3 bucket: ${{ env.AWS_S3_BUCKET }}"

      - name: Create CloudFront Invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" # Invalidate all paths. Adjust if you have specific invalidation needs.
          echo "Successfully initiated CloudFront invalidation for distribution: ${{ env.AWS_CLOUDFRONT_DISTRIBUTION_ID }}"


